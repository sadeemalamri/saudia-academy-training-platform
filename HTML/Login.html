<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudia Academy | Login</title>

    <link rel="stylesheet" href="../CSS/styles.css">
  <link rel="stylesheet" href="../CSS/reset.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<section class="login-page">

    <img src="../images/login-bg.png" class="login-bg" alt="Background">

    <div class="login-card">

        <a href="index.html" title="Back to Home">
            <img src="../images/logo.png" class="login-logo" alt="Saudia Academy Logo">
        </a>

        <h1>Welcome Back</h1>

        <p class="login-subtitle">Sign in to access your account</p>

        <form id="loginForm">

            <label>Email Address</label>
            <div class="input-box">
                <i class="fa-regular fa-envelope"></i>
                <input id="loginEmail" type="email" placeholder="Enter your email" required>
            </div>

            <label>Password</label>
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input id="password" type="password" placeholder="Enter your password" required>
                <i id="togglePassword" class="fa-regular fa-eye-slash toggle-password"></i>
            </div>

<a href="forgot-password.html" class="forgot">Forgot password?</a>

            <p id="loginError" style="display:none;color:#c0392b;margin:8px 0 0;font-size:14px;"></p>

            <button class="login-submit" type="submit" id="loginSubmitBtn">Login</button>

            <p class="create-text">
    Don't have an account?
    <a href="application.html">Create account</a>
</p>

        </form>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../JS/config.js"></script>
<script src="../JS/supabaseClient.js"></script>
<script src="../JS/login.js"></script>

</body>
</html>

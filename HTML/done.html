<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Submitted</title>
  <link rel="stylesheet" href="../CSS/reset.css">

  <link rel="stylesheet" href="../CSS/done.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<section class="done-page">

  <header class="done-header">
    <img src="../images/logo.png" class="logo" alt="Saudia Academy">
  </header>

  <div class="done-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="done-content">
    <div class="success-card">

      <div class="success-badge">
        <div class="badge-ring"></div>
        <i class="fa-solid fa-check"></i>

        <span class="confetti-dot dot-1"></span>
        <span class="confetti-dot dot-2"></span>
        <span class="confetti-dot dot-3"></span>
        <span class="confetti-dot dot-4"></span>
        <span class="confetti-dot dot-5"></span>
        <span class="confetti-dot dot-6"></span>
      </div>

      <span class="eyebrow">Application Status</span>

      <h1>Application Submitted <span class="highlight">Successfully!</span></h1>

      <p>
        Thank you for applying at Saudia Academy.
        You'll receive a confirmation email shortly with the next steps.
      </p>

      <a href="student-dashboard.html" class="cta-btn">
        <span>Go to My Account</span>
        <i class="fa-solid fa-arrow-right"></i>
      </a>

      <p class="sub-note">A copy of your application has been sent to your email</p>

    </div>
  </main>

</section>

</body>
</html>

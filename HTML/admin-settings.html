<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Settings</title>

  <link rel="stylesheet" href="../CSS/admin-settings.css">
  <link rel="stylesheet" href="../CSS/reset.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >
</head>

<body>

<div class="dashboard" id="dashboard">

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">

    <div class="logo-box">
      <img
        src="../images/logo.png"
        class="side-logo"
        alt="Saudia Academy Logo"
      >

      <button class="sidebar-close" id="sidebarClose" title="Close menu">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <nav class="side-menu">

      <a href="admin-dashboard.html" class="menu-link">
        <i class="fa-solid fa-house"></i>
        <span>Dashboard</span>
      </a>

      <a href="admin-applications.html" class="menu-link">
        <i class="fa-solid fa-users"></i>
        <span>Applications</span>
      </a>

      <a href="assign-supervisor.html" class="menu-link">
        <i class="fa-solid fa-user-tie"></i>
        <span>Supervisors</span>
      </a>

      <a href="training-plans.html" class="menu-link">
        <i class="fa-regular fa-calendar-check"></i>
        <span>Training Plans</span>
      </a>

      <a href="admin-jobs.html" class="menu-link">
        <i class="fa-solid fa-briefcase"></i>
        <span>Jobs</span>
      </a>

      <a href="admin-settings.html" class="menu-link active">
        <i class="fa-solid fa-gear"></i>
        <span>Settings</span>
      </a>

      <a href="loading.html" class="menu-link" id="logoutBtn" data-logout>
  <i class="fa-solid fa-arrow-right-from-bracket"></i>
  <span>Log Out</span>
</a>


    </nav>

  </aside>

  <!-- Main -->
  <main class="main">

    <!-- Topbar -->
    <header class="topbar">

      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" title="Open menu">
          <i class="fa-solid fa-bars"></i>
        </button>

        <img src="../images/logo.png" class="topbar-logo" alt="Saudia Academy">
      </div>

      <div class="top-actions">

        <div class="admin-user">
          <i class="fa-regular fa-circle-user"></i>
          <span id="topbarAdminName">Loading...</span>
        </div>
      </div>

    </header>

    <!-- Content -->
    <section class="content">

      <div class="page-header">
        <div>
          <h1>My Profile</h1>
          <p>View and manage your personal information.</p>
        </div>
      </div>

      <div class="settings-card">

        <!-- Profile -->
        <div class="profile-side">

          <div class="avatar-circle">
            <i class="fa-solid fa-user"></i>
          </div>

          <p class="admin-role">Administrator</p>

        </div>

        <!-- Settings -->
        <div class="settings-content">

          <h2>Settings</h2>

          <form class="settings-form" id="adminSettingsForm" novalidate>

            <div class="form-row">
              <label for="fullName">Full Name</label>

              <div class="input-with-icon">
                <input
                  id="fullName"
                  name="fullName"
                  type="text"
                  placeholder="Enter your full name"
                  readonly
                  required
                  class="editable-field"
                >

                <i
                  class="fa-solid fa-pen edit-icon"
                  onclick="toggleEditField('fullName', this)"
                  title="Edit"
                ></i>
              </div>
            </div>

            <div class="form-row">
              <label for="gender">Gender</label>

              <select
                id="gender"
                name="gender"
                class="gender-select"
                required
              >
                <option value="" disabled selected>Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </div>

            <div class="form-row">
              <label for="password">Password</label>

              <div class="input-with-icon">
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Change password"
                  readonly
                  class="editable-field"
                >

                <i
                  class="fa-solid fa-pen edit-icon"
                  onclick="openPasswordModal()"
                  title="Change password"
                ></i>
              </div>
            </div>

            <div class="form-row">
              <label for="phone">Phone Number</label>

              <div class="input-with-icon">
                <input
                  id="phone"
                  name="phone"
                  type="text"
                  placeholder="9665XXXXXXXX"
                  maxlength="12"
                  readonly
                  class="editable-field"
                >

                <i
                  class="fa-solid fa-pen edit-icon"
                  onclick="toggleEditField('phone', this)"
                  title="Edit"
                ></i>
              </div>
            </div>

            <div class="form-row">
              <label for="email">Email Address</label>

              <input
                id="email"
                name="email"
                type="email"
                placeholder="Email address will appear here"
                readonly
                class="locked-field"
              >
            </div>

            <div class="form-row">
              <label for="language">Language</label>

              <select
                id="language"
                name="language"
                class="language-select"
              >
                <option value="english">English</option>
                <option value="arabic">Arabic</option>
              </select>
            </div>

          </form>

          <div class="button-area">
            <button
              type="submit"
              form="adminSettingsForm"
              class="save-btn"
              id="saveChangesBtn"
            >
              Save Changes
            </button>
          </div>

        </div>

      </div>

    </section>

  </main>

</div>

<!-- Change Password Modal -->
<div class="modal-overlay" id="passwordModal">
  <div class="password-modal">

    <button type="button" class="close-modal" onclick="closePasswordModal()" title="Close">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <h2>Change Password</h2>

    <p class="modal-subtitle">
      Please enter your current password and choose a new one.
    </p>

    <form class="password-form" id="passwordForm" novalidate>

      <div class="password-group">
        <label for="currentPassword">Current Password</label>

        <div class="password-input-box">
          <input
            id="currentPassword"
            name="currentPassword"
            type="password"
            placeholder="Enter current password"
            autocomplete="current-password"
            required
          >

          <i
            class="fa-regular fa-eye-slash toggle-pass"
            onclick="togglePassword('currentPassword', this)"
            title="Show password"
          ></i>
        </div>
      </div>

      <div class="password-group">
        <label for="newPassword">New Password</label>

        <div class="password-input-box">
          <input
            id="newPassword"
            name="newPassword"
            type="password"
            placeholder="Enter new password"
            autocomplete="new-password"
            minlength="8"
            required
          >

          <i
            class="fa-regular fa-eye-slash toggle-pass"
            onclick="togglePassword('newPassword', this)"
            title="Show password"
          ></i>
        </div>
      </div>

      <div class="password-group">
        <label for="confirmPassword">Confirm New Password</label>

        <div class="password-input-box">
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="Confirm new password"
            autocomplete="new-password"
            minlength="8"
            required
          >

          <i
            class="fa-regular fa-eye-slash toggle-pass"
            onclick="togglePassword('confirmPassword', this)"
            title="Show password"
          ></i>
        </div>
      </div>

      <p id="passwordUpdateError" class="password-error" hidden></p>

      <div class="modal-buttons">
        <button type="button" class="cancel-btn" onclick="closePasswordModal()">
          Cancel
        </button>

        <button type="submit" class="update-btn" id="updatePasswordBtn">
          Update Password
        </button>
      </div>

    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../JS/config.js"></script>
<script src="../JS/supabaseClient.js"></script>
<script src="../JS/admin-settings.js"></script>

</body>
</html>
